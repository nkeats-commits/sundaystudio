    ScholarlySourceManifest:
      type: object
      description: Metadata for a single bundled public-domain commentary source.
      required: [id, title, author, year, license, sourceUrl, description, bookCount, scope, coveredBooks]
      properties:
        id:
          type: string
          description: Stable opaque identifier (also the directory name on disk).
        title:
          type: string
        author:
          type: string
        year:
          type: string
          description: Publication year or year range (free-form text).
        license:
          type: string
          description: Always "Public Domain" for v1; reserved for future expansion.
        sourceUrl:
          type: string
          description: Canonical URL where the underlying public-domain text lives.
        description:
          type: string
        bookCount:
          type: integer
          description: Number of Bible books this source has commentary data for.
        scope:
          type: string
          description: >
            Human-readable coverage summary derived from the corpus.
            Examples: "Whole Bible", "New Testament", "39 books", "Psalms only".
        coveredBooks:
          type: array
          description: >
            Canonical title-cased book names covered by this source, in canonical
            Bible order. Used to render a tooltip breakdown in the UI.
          items:
            type: string

    SourcesResponse:
      type: object
      required: [sources, enabledSourceIds, defaults]
      properties:
        sources:
          type: array
          description: All registered sources, alphabetical by title.
          items:
            $ref: "#/components/schemas/ScholarlySourceManifest"
        enabledSourceIds:
          type: array
          description: Source ids the user currently has enabled (post-defaults fallback).
          items:
            type: string
        defaults:
          type: array
          description: Curated default selection used when the user has no saved preferences.
          items:
            type: string

    UpdateSourcePreferencesBody:
      type: object
      required: [enabledSourceIds]
      properties:
        enabledSourceIds:
          type: array
          description: Full replacement list of enabled source ids. Empty array disables all sources.
          items:
            type: string
