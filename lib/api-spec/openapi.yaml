  /integrations/pcs/connect-url:
    post:
      operationId: createPcsConnectUrl
      tags: [integrations]
      summary: Build a Planning Center OAuth authorization URL for the current user
      responses:
        "200":
          description: Authorization URL the browser should redirect to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PcsConnectUrl"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Planning Center is not configured on the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /integrations/pcs/status:
    get:
      operationId: getPcsStatus
      tags: [integrations]
      summary: Connection status, organization, and last-sync stats
      responses:
        "200":
          description: Connection status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PcsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /integrations/pcs/sync:
    post:
      operationId: syncPcsSongs
      tags: [integrations]
      summary: Re-import songs from Planning Center for the current user
      responses:
        "200":
          description: Sync result counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PcsSyncResult"
        "400":
          description: Not connected to Planning Center
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Planning Center returned an error during sync
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /integrations/pcs/disconnect:
    delete:
      operationId: disconnectPcs
      tags: [integrations]
      summary: Remove the Planning Center connection for the current user
      responses:
        "204":
          description: Disconnected
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    PcsConnectUrl:
      type: object
      properties:
        authUrl:
          type: string
          description: Full Planning Center authorization URL the browser should redirect to.
      required: [authUrl]

    PcsStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: True when the server has PCS_CLIENT_ID/SECRET available.
        connected:
          type: boolean
          description: True when the current user has an active Planning Center connection.
        organizationName:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          nullable: true
          description: ISO8601 timestamp of the most recent sync attempt.
        lastSyncSongCount:
          type: integer
          nullable: true
        lastSyncError:
          type: string
          nullable: true
      required: [configured, connected]

    PcsSyncResult:
      type: object
      properties:
        total:
          type: integer
          description: Total songs found in the connected Planning Center library.
        inserted:
          type: integer
          description: Songs newly imported into WorshipFlow on this run.
        updated:
          type: integer
          description: Existing imported songs whose metadata was refreshed on this run.
      required: [total, inserted, updated]

    ChurchProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        churchName:
          type: string
        denomination:
          type: string
        theology:
          type: string
        location:
          type: string
        averageAttendance:
          type: integer
          nullable: true
        musicStyle:
          type: string
        traditions:
          type: string
        leaderName:
          type: string
        leaderRole:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - churchName
        - denomination
        - theology
        - location
        - musicStyle
        - traditions
        - leaderName
        - leaderRole
        - createdAt
        - updatedAt

    UpsertChurchProfileBody:
      type: object
      properties:
        churchName:
          type: string
          minLength: 1
        denomination:
          type: string
        theology:
          type: string
        location:
          type: string
        averageAttendance:
          type: integer
          nullable: true
        musicStyle:
          type: string
        traditions:
          type: string
        leaderName:
          type: string
          minLength: 1
        leaderRole:
          type: string
      required:
        - churchName
        - leaderName

    MeResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        profile:
          allOf:
            - $ref: "#/components/schemas/ChurchProfile"
          nullable: true
      required: [userId]

    ServicePlanContent:
      type: object
      description: Structured content for a service plan
      properties:
        callToWorship:
          type: string
          nullable: true
        openingPrayer:
          type: string
          nullable: true
        scriptureReading:
          type: string
          nullable: true
        sermonNotes:
          type: string
          nullable: true
        confession:
          type: string
          nullable: true
        assurance:
          type: string
          nullable: true
        benediction:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        order:
          type: array
          items:
            $ref: "#/components/schemas/ServicePlanItem"
      required: [order]

    ServicePlanItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [song, scripture, prayer, sermon, communion, offering, welcome, benediction, transition, custom]
        title:
          type: string
        body:
          type: string
        durationMinutes:
          type: integer
          nullable: true
        linkedKind:
          type: string
          nullable: true
          enum: [sermon, library_item]
          description: |
            Optional source this slot was pulled from. When present, the
            UI shows a "Linked to ..." pill that navigates to the source.
            `body` always carries a snapshot so the slot keeps rendering
            even if the source is later edited or deleted.
        linkedId:
          type: integer
          nullable: true
        linkedTitle:
          type: string
          nullable: true
          description: Snapshot of the linked source's title for display when the source is gone.
      required: [id, kind, title, body]

    LinkedServiceRef:
      type: object
      description: A service plan that links back to a sermon or library item.
      properties:
        id:
          type: integer
        title:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
      required: [id, title]

    ServicePlan:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
        content:
          $ref: "#/components/schemas/ServicePlanContent"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - scripture
        - theme
        - season
        - content
        - createdAt
        - updatedAt

    CreateServicePlanBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
        content:
          $ref: "#/components/schemas/ServicePlanContent"
      required: [title, content]

    UpdateServicePlanBody:
      type: object
      properties:
        title:
          type: string
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
        content:
          $ref: "#/components/schemas/ServicePlanContent"

    LibraryItem:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        kind:
          type: string
          enum: [liturgy, song, speaking_moment, devotional]
        title:
          type: string
        content:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        isRepertoire:
          type: boolean
          description: True when this song is part of the user's personal repertoire that worship-song generators will prefer.
        createdAt:
          type: string
          format: date-time
      required: [id, userId, kind, title, content, tags, isRepertoire, createdAt]

    CreateLibraryItemBody:
      type: object
      properties:
        kind:
          type: string
          enum: [liturgy, song, speaking_moment, devotional]
        title:
          type: string
          minLength: 1
        content:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        isRepertoire:
          type: boolean
          description: When true, also marks the saved song as part of the user's repertoire.
      required: [kind, title, content]

    UpdateLibraryItemBody:
      type: object
      description: Partial update for a saved library item. Any subset of title, content, or tags may be supplied.
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string

    SetRepertoireBody:
      type: object
      properties:
        isRepertoire:
          type: boolean
      required: [isRepertoire]

    RepertoireImportSong:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
        style:
          type: string
        bpm:
          type: integer
          minimum: 30
          maximum: 300
          description: Optional tempo in beats per minute. Helps the AI pick fast songs for upbeat slots and slower songs for reflective ones.
        tags:
          type: array
          items:
            type: string
      required: [title]

    BulkImportRepertoireBody:
      type: object
      properties:
        songs:
          type: array
          items:
            $ref: "#/components/schemas/RepertoireImportSong"
          minItems: 1
      required: [songs]

    BulkImportRepertoireResult:
      type: object
      properties:
        added:
          type: integer
          description: Number of new repertoire songs created.
        skippedDuplicates:
          type: integer
          description: Number of submitted titles that matched an existing repertoire song (case-insensitive title match).
        invalidLines:
          type: integer
          description: Number of submitted entries dropped because they lacked a usable title.
      required: [added, skippedDuplicates, invalidLines]

    DashboardStat:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
      required: [label, value]

    DashboardSuggestion:
      type: object
      properties:
        id:
          type: string
        prompt:
          type: string
        kind:
          type: string
          enum: [service, liturgy, songs, speaking_moment, devotional]
      required: [id, prompt, kind]

    DashboardResponse:
      type: object
      properties:
        verseOfDay:
          type: object
          properties:
            text:
              type: string
            reference:
              type: string
          required: [text, reference]
        recentServices:
          type: array
          items:
            $ref: "#/components/schemas/ServicePlan"
        servicesThisMonth:
          type: integer
        librarySize:
          type: integer
        totalServices:
          type: integer
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/DashboardSuggestion"
      required: [verseOfDay, recentServices, servicesThisMonth, librarySize, totalServices, suggestions]

    GenerateServicePlanBody:
      type: object
      properties:
        theme:
          type: string
        scripture:
          type: string
        season:
          type: string
        serviceLength:
          type: string
          description: e.g. "60 minutes", "75 minutes"
        notes:
          type: string
        flow:
          type: array
          description: |
            Optional ordered service flow defined by the user. When present,
            the generator MUST return `content.order` with exactly these
            entries in this order, preserving each step's kind and the
            supplied `stepName` as the slot's title.
          items:
            $ref: "#/components/schemas/ServiceFlowStep"
      required: [theme]

    ServiceFlowStep:
      type: object
      description: One step in a user-defined service flow.
      properties:
        stepName:
          type: string
          minLength: 1
          description: The display name for this step (e.g. "Prayer of Confession").
        kind:
          type: string
          enum: [song, scripture, prayer, sermon, communion, offering, welcome, benediction, transition, custom]
      required: [stepName, kind]

    ServiceTemplate:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        description:
          type: string
        flow:
          type: array
          items:
            $ref: "#/components/schemas/ServiceFlowStep"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, name, description, flow, createdAt, updatedAt]

    CreateServiceTemplateBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        flow:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceFlowStep"
      required: [name, flow]

    UpdateServiceTemplateBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        flow:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceFlowStep"

    GeneratedServicePlan:
      type: object
      properties:
        title:
          type: string
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        content:
          $ref: "#/components/schemas/ServicePlanContent"
      required: [title, scripture, theme, season, content]

    GenerateStepContentBody:
      type: object
      description: |
        Request body for regenerating the text of a single service-plan slot.
        `kind` must be a valid `ServiceFlowStep.kind` other than `sermon`.
      properties:
        kind:
          type: string
          enum: [song, scripture, prayer, communion, offering, welcome, benediction, transition, custom]
        stepName:
          type: string
          minLength: 1
          description: The slot's title as the user named it (e.g. "Opening Song").
        theme:
          type: string
        scripture:
          type: string
        season:
          type: string
        serviceLength:
          type: string
        notes:
          type: string
      required: [kind, stepName, theme]

    GeneratedStepContent:
      type: object
      properties:
        body:
          type: string
          description: The regenerated body text for the slot.
        durationMinutes:
          type: integer
          nullable: true
      required: [body]

    GenerateJobStarted:
      type: object
      description: |
        Returned by `POST /generate/step-content` to start a background
        generation job. Clients then poll `GET /generate/jobs/{jobId}` for
        status. (Other `/generate/*` endpoints in this spec are still
        documented as SSE/direct-result responses.)
      properties:
        jobId:
          type: string
      required: [jobId]

    GenerateJobSnapshot:
      type: object
      description: |
        Snapshot of a background generation job. `result` is present when
        `status` is `done`; its shape depends on which generation endpoint
        started the job.
      properties:
        status:
          type: string
          enum: [pending, done, error, unknown]
        charsReceived:
          type: integer
          description: Total characters of model output accumulated so far.
        partialTail:
          type: string
          description: Tail of the streamed model text, capped server-side.
        result:
          description: |
            Final result payload when `status` is `done`. Shape depends on
            the endpoint that started the job (e.g. `GeneratedStepContent`
            for `/generate/step-content`).
        errorMessage:
          type: string
          description: Human-readable error when `status` is `error`.
      required: [status]

    GenerateLiturgyBody:
      type: object
      properties:
        kind:
          type: string
          enum: [call_to_worship, opening_prayer, confession, assurance, communion, benediction, prayer_of_the_people]
        theme:
          type: string
        scripture:
          type: string
        season:
          type: string
        tone:
          type: string
          description: e.g. "contemplative", "celebratory"
        format:
          type: string
          enum: [call_response, leader_only]
          description: |
            Output format style.
            - `call_response` (default): leader/people antiphonal lines.
            - `leader_only`: a single continuous spoken piece in the leader's voice.
        alignmentNotes:
          type: string
          maxLength: 4000
          description: Optional sermon notes, song lyrics, or other text the liturgy should echo in language and imagery.
      required: [kind, theme]

    RecommendedScripture:
      type: object
      properties:
        reference:
          type: string
          description: A specific passage reference, e.g. "Psalm 95:1-7".
        rationale:
          type: string
          description: One short sentence on why this passage fits.
      required: [reference, rationale]

    GeneratedLiturgy:
      type: object
      properties:
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        notes:
          type: string
        format:
          type: string
          enum: [call_response, leader_only]
          description: The format the liturgy was generated in (echoes the request).
        alignmentNotes:
          type: string
          description: Echoes the alignment notes the user supplied (if any), so the saved item retains its provenance.
        recommendedScripture:
          $ref: "#/components/schemas/RecommendedScripture"
          description: Present only when the user did not supply a scripture; the AI's suggested anchor passage with rationale.
      required: [kind, title, body]

    GenerateSongsBody:
      type: object
      properties:
        theme:
          type: string
        scripture:
          type: string
        style:
          type: string
          description: e.g. "hymn", "modern worship", "gospel", "acoustic"
        count:
          type: integer
        repertoireMode:
          type: string
          enum: [off, prefer, strict]
          description: |
            How to use the user's saved repertoire when suggesting songs.
            - `off`: ignore the repertoire entirely.
            - `prefer` (default): prioritize repertoire songs and fill the rest with new suggestions.
            - `strict`: only suggest songs from the user's repertoire; never invent new titles.
        alignmentNotes:
          type: string
          maxLength: 4000
          description: Optional sermon notes, source text, or other material the song picks should echo in theme and imagery.
        bpmMin:
          type: integer
          minimum: 30
          maximum: 300
          description: Optional lower bound for the suggested songs' tempo. Bounds out of order are auto-swapped.
        bpmMax:
          type: integer
          minimum: 30
          maximum: 300
          description: Optional upper bound for the suggested songs' tempo. Bounds out of order are auto-swapped.
      required: [theme]

    SongSuggestion:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        style:
          type: string
        bpm:
          type: integer
          nullable: true
          description: "Tempo in beats per minute. Returned only when the value comes from a trusted source — the user's repertoire (which itself can be sourced from Planning Center or hand-typed). The AI Song Assistant no longer guesses BPMs; rows where the server has no trusted value report `bpm: null` so worship leaders can fill them in deliberately."
        themes:
          type: array
          items:
            type: string
        whyItFits:
          type: string
        inRepertoire:
          type: boolean
          description: Server-set flag — true when the suggested title matches one of the user's repertoire songs (case-insensitive title match).
      required: [title, artist, whyItFits]

    GeneratedSongs:
      type: object
      properties:
        theme:
          type: string
        songs:
          type: array
          items:
            $ref: "#/components/schemas/SongSuggestion"
        notice:
          type: string
          description: Optional explanatory note from the server, e.g. when Strict mode produced fewer songs than requested.
        alignmentNotes:
          type: string
          description: Echoes the alignment notes the user supplied (if any), so the saved item retains its provenance.
      required: [theme, songs]

    GenerateSpeakingMomentBody:
      type: object
      properties:
