          description: Stripe not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /manuscripts:
    get:
      operationId: listManuscripts
      tags: [manuscripts]
      summary: List the user's uploaded pastor manuscripts
      responses:
        "200":
          description: List of manuscripts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PastorManuscript"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createManuscript
      tags: [manuscripts]
      summary: Register an uploaded manuscript (after presigned URL upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, storedPath]
              properties:
                fileName:
                  type: string
                storedPath:
                  type: string
      responses:
        "201":
          description: Created manuscript record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PastorManuscript"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /manuscripts/{id}:
    delete:
      operationId: deleteManuscript
      tags: [manuscripts]
      summary: Delete a manuscript and remove it from storage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /manuscripts/analyze:
    post:
      operationId: analyzeManuscripts
      tags: [manuscripts]
      summary: Trigger background voice analysis of uploaded manuscripts
      responses:
        "200":
          description: Analysis started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /sources:
    get:
      operationId: listScholarlySources
      summary: List bundled public-domain commentary sources and the user's enabled set
      tags: [sources]
      responses:
        "200":
          description: Registry + per-user preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sources/preferences:
    put:
      operationId: updateScholarlySourcePreferences
      summary: Update which scholarly sources the Sermon Builder consults for this user
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSourcePreferencesBody"
      responses:
        "200":
          description: Updated preferences (echoes the same shape as GET /sources)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesResponse"
        "400":
          description: Validation error (e.g. unknown source id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /help-articles:
    get:
      operationId: listHelpArticles
      tags: [help]
      summary: List all published help articles (optionally filtered by search query)
      security: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Optional search query to filter by title, body, or category
      responses:
        "200":
          description: List of published help articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpArticle"

  /help-articles/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getHelpArticle
      tags: [help]
      summary: Get a single published help article by slug
      security: []
      responses:
        "200":
          description: The help article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticle"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/help-articles:
    get:
      operationId: adminListHelpArticles
      tags: [admin]
      summary: List all help articles (including unpublished) — owner only
      responses:
        "200":
          description: All help articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpArticle"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: adminCreateHelpArticle
      tags: [admin]
      summary: Create a new help article — owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpArticleBody"
      responses:
        "201":
          description: Created article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/help-articles/article-order:
    put:
      operationId: adminSetHelpArticleOrder
      tags: [admin]
      summary: Set the display order of articles within a category — owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpArticleOrderRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleOrderRequest"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/help-articles/category-order:
    get:
      operationId: adminGetHelpCategoryOrder
      tags: [admin]
      summary: Get the custom sort order for help article categories — owner only
      responses:
        "200":
          description: Current category order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpCategoryOrderResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: adminSetHelpCategoryOrder
      tags: [admin]
      summary: Set the custom sort order for help article categories — owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpCategoryOrderResponse"
      responses:
        "200":
          description: Updated category order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpCategoryOrderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/help-articles/images:
    post:
      operationId: adminUploadHelpArticleImage
      tags: [admin]
      summary: Upload an image for use in a help article — owner only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (PNG, JPG, WebP, GIF — max 8 MB)
      responses:
        "200":
          description: Uploaded image public URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
                    description: Public URL to use in markdown as ![alt](url)
        "400":
          description: No file or invalid file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/help-articles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: adminUpdateHelpArticle
      tags: [admin]
      summary: Update a help article — owner only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpArticleBody"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticle"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: adminDeleteHelpArticle
      tags: [admin]
      summary: Delete a help article — owner only
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    HelpArticle:
      type: object
      required: [id, slug, title, body, category, published, createdAt, updatedAt]
      properties:
        id:
          type: integer
        slug:
          type: string
          description: URL-safe identifier (lowercase letters, numbers, hyphens)
        title:
          type: string
        body:
          type: string
          description: Markdown content of the article
        category:
          type: string
          description: Category label for grouping on the help center
        published:
          type: boolean
          description: Only published articles are visible on the public help center
        position:
          type: integer
          nullable: true
          description: Display order within the category (null = sorted by title)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HelpArticleOrderRequest:
      type: object
      required: [category, ids]
      properties:
        category:
          type: string
          description: The category whose articles are being reordered
        ids:
          type: array
          items:
            type: integer
          description: Article IDs in the desired display order

    HelpCategoryOrderResponse:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items:
            type: string
          description: Category names in desired display order

    HelpArticleBody:
      type: object
      required: [slug, title]
      properties:
        slug:
          type: string
          description: URL-safe identifier (lowercase letters, numbers, hyphens only)
        title:
          type: string
        body:
          type: string
          default: ""
        category:
          type: string
          default: General
        published:
          type: boolean
          default: false

    BillingRedirect:
      type: object
      properties:
        url:
          type: string
          description: URL the browser should be redirected to (Checkout or Portal).
      required: [url]

    AccessState:
      type: object
      description: |
        Discriminated union describing whether the user is in their trial,
        actively subscribed, lapsed, or expired.  Discriminated by `kind`.
      properties:
        kind:
          type: string
          enum: [trial, active, trialing, past_due, canceled, expired]
        daysLeft:
          type: integer
          nullable: true
          description: Days remaining in the local trial (only when kind=trial).
        trialEndsAt:
          type: string
          nullable: true
          description: When the local trial ends (only when kind=trial).
        trialEndedAt:
          type: string
          nullable: true
          description: When the local trial ended (only when kind=expired).
        currentPeriodEnd:
          type: string
          nullable: true
          description: End of the current Stripe billing period.
        cancelAtPeriodEnd:
          type: boolean
          nullable: true
          description: True if a Stripe subscription is set to cancel at period end.
      required: [kind]

    BillingStatusResponse:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/AccessState"
        trialDays:
          type: integer
          description: Length of the free trial in days.
      required: [state, trialDays]

    TrialEventBody:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [ss_upgrade_prompt_shown, ss_upgrade_prompt_clicked, ss_checkout_started]
        context:
          type: object
          additionalProperties: true

    TrialEventAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean

    AdminMe:
      type: object
      properties:
        ownerEmail:
          type: string
          nullable: true
        userId:
          type: string
      required: [userId]

    AdminMetrics:
      type: object
      required: [totals, trials, subscriptions, revenue, series, stripeAvailable, conversion]
      properties:
        totals:
          type: object
          required: [users, signups7d, signups30d]
          properties:
            users: { type: integer }
            signups7d: { type: integer }
            signups30d: { type: integer }
        trials:
          type: object
          required: [active, endingSoon, expired]
          properties:
            active: { type: integer }
            endingSoon: { type: integer }
            expired: { type: integer }
        subscriptions:
          type: object
          required: [active, trialing, pastDue, canceled]
          properties:
            active: { type: integer }
            trialing: { type: integer }
            pastDue: { type: integer }
            canceled: { type: integer }
        revenue:
          type: object
          required:
            [
              mrrCents,
              conversions30d,
              conversions90d,
              churn30d,
              conversionRate30d,
              conversionRate90d,
            ]
          properties:
            mrrCents: { type: integer }
            conversions30d: { type: integer }
            conversions90d: { type: integer }
            churn30d: { type: integer }
            conversionRate30d:
              type: number
              description: Trial → paid conversion rate (%) over last 30 days.
            conversionRate90d:
              type: number
              description: Trial → paid conversion rate (%) over last 90 days.
        series:
          type: object
          required: [signups, subscriptions]
          properties:
            signups:
              type: array
              items:
                $ref: "#/components/schemas/AdminSeriesPoint"
            subscriptions:
              type: array
              items:
                $ref: "#/components/schemas/AdminSeriesPoint"
        stripeAvailable:
          type: boolean
        conversion:
          $ref: "#/components/schemas/AdminConversionFunnel"
        aiCost:
          type: object
          required:
            [
              totalInputTokensThisMonth,
              totalOutputTokensThisMonth,
              estimatedCostThisMonth,
              avgCostPerActiveUser,
              dailyCost,
            ]
          properties:
            totalInputTokensThisMonth:
              type: integer
            totalOutputTokensThisMonth:
              type: integer
            estimatedCostThisMonth:
              type: number
              description: Estimated cost in USD for the current calendar month.
            avgCostPerActiveUser:
              type: number
              description: Average cost per user who generated anything this month.
            dailyCost:
              type: array
              description: Last 30 days of daily cost data for a bar chart.
              items:
                $ref: "#/components/schemas/AdminCostSeriesPoint"

    AdminConversionFunnel:
      type: object
      required: [activatedUsers, promptShown, promptClicked, checkoutStarted, subscriptionsStarted, activatedToPaidRate, byTrialDay]
      properties:
        activatedUsers: { type: integer }
        promptShown: { type: integer }
        promptClicked: { type: integer }
        checkoutStarted: { type: integer }
        subscriptionsStarted: { type: integer }
        activatedToPaidRate:
          type: number
          description: Activated-to-paid conversion rate (%).
        byTrialDay:
          type: array
          items:
            $ref: "#/components/schemas/AdminConversionDay"

    AdminConversionDay:
      type: object
      required: [trialDay, activated, promptShown, promptClicked, checkoutStarted, subscriptionsStarted]
      properties:
        trialDay: { type: integer }
        activated: { type: integer }
        promptShown: { type: integer }
        promptClicked: { type: integer }
        checkoutStarted: { type: integer }
        subscriptionsStarted: { type: integer }

    AdminCostSeriesPoint:
      type: object
      required: [day, costUsd]
      properties:
        day:
          type: string
          description: ISO date (YYYY-MM-DD)
        costUsd:
          type: number

    AdminSeriesPoint:
      type: object
      required: [day, count]
      properties:
        day:
          type: string
          description: ISO date (YYYY-MM-DD)
        count:
          type: integer

    AdminUserAiUsageByType:
      type: object
      required: [generationType, inputTokens, outputTokens, costUsd, eventCount]
      properties:
        generationType: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        costUsd: { type: number }
        eventCount: { type: integer }

    AdminUserAiUsage:
      type: object
      required:
        [
          allTime,
          last30d,
          byType,
        ]
      properties:
        allTime:
          type: object
          required: [inputTokens, outputTokens, costUsd, eventCount]
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            costUsd: { type: number }
            eventCount: { type: integer }
        last30d:
          type: object
          required: [inputTokens, outputTokens, costUsd, eventCount]
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            costUsd: { type: number }
            eventCount: { type: integer }
        byType:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserAiUsageByType"

    AdminUserSummary:
      type: object
      required: [id, createdAt, state]
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        createdAt: { type: string }
        stripeCustomerId: { type: string, nullable: true }
        state:
          $ref: "#/components/schemas/AccessState"
        lastActivityAt:
          type: string
          nullable: true

    AdminUserList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserSummary"
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    AdminUserDetail:
      type: object
      required: [id, createdAt, state, counts]
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        createdAt: { type: string }
        trialStartedAt: { type: string, nullable: true }
        stripeCustomerId: { type: string, nullable: true }
        state:
          $ref: "#/components/schemas/AccessState"
        counts:
          type: object
          required: [servicePlans, sermons]
          properties:
            servicePlans: { type: integer }
            sermons: { type: integer }
        lastActivityAt:
          type: string
          nullable: true
        eventStamps:
          type: object
          description: ISO timestamps recording when each one-time Resend event was fired for this user. Null means not yet fired.
          properties:
            churchProfileEventFiredAt: { type: string, nullable: true }
            firstServicePlanEventFiredAt: { type: string, nullable: true }
            firstLibraryItemEventFiredAt: { type: string, nullable: true }
            firstSermonEventFiredAt: { type: string, nullable: true }
            planningCenterEventFiredAt: { type: string, nullable: true }
            scholarlySourcesEventFiredAt: { type: string, nullable: true }
            repertoireEventFiredAt: { type: string, nullable: true }

    PcsConnectUrl:
      type: object
      properties:
        authUrl:
          type: string
          description: Full Planning Center authorization URL the browser should redirect to.
      required: [authUrl]

    PcsStatus:
      type: object
      properties:
        configured:
          type: boolean
          description: True when the server has PCS_CLIENT_ID/SECRET available.
        connected:
          type: boolean
          description: True when the current user has an active Planning Center connection.
        organizationName:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          nullable: true
          description: ISO8601 timestamp of the most recent sync attempt.
        lastSyncSongCount:
          type: integer
          nullable: true
        lastSyncError:
          type: string
          nullable: true
      required: [configured, connected]

    PcsSyncResult:
      type: object
      properties:
        total:
          type: integer
          description: Total songs found in the connected Planning Center library.
        inserted:
          type: integer
          description: Songs newly imported into Sunday Studio on this run.
        updated:
          type: integer
          description: Existing imported songs whose metadata was refreshed on this run.
        serviceTypeFilterSkipped:
          type: boolean
          description: >
            True when a service-type filter was requested but resolved to 0 song IDs
            (a Planning Center API compatibility issue). The sync fell back to importing
            all songs so the user always gets results.
      required: [total, inserted, updated]

    PcsServiceType:
      type: object
      properties:
        id:
          type: string
          description: Planning Center service type ID.
        name:
          type: string
          description: Human-readable name (e.g. "Sunday Morning").
      required: [id, name]

    PcsSyncBody:
      type: object
      description: Optional filters for the Planning Center sync. Omit entirely (or send {}) to import the full library as before.
      properties:
        serviceTypeIds:
          type: array
          items:
            type: string
          description: When set, only import songs that have been used in at least one of these Planning Center service types.
        lastUsedSince:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: "Optional ISO YYYY-MM-DD date. When set, only import songs whose last_scheduled_at is on or after this date. Songs that have never been scheduled are also excluded."

    ChurchProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        churchName:
          type: string
        denomination:
          type: string
        theology:
          type: string
        location:
          type: string
        averageAttendance:
          type: integer
          nullable: true
        musicStyle:
          type: string
        traditions:
          type: string
        leaderName:
          type: string
        leaderRole:
          type: string
        toneDescription:
          type: string
        derivedToneDescription:
          type: string
        missionStatement:
          type: string
        focusAreas:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - churchName
        - denomination
        - theology
        - location
        - musicStyle
        - traditions
        - leaderName
        - leaderRole
        - toneDescription
        - derivedToneDescription
        - missionStatement
        - focusAreas
        - createdAt
        - updatedAt

    UpsertChurchProfileBody:
      type: object
      properties:
        churchName:
          type: string
          minLength: 1
        denomination:
          type: string
        theology:
          type: string
        location:
          type: string
        averageAttendance:
          type: integer
          nullable: true
        musicStyle:
          type: string
        traditions:
          type: string
        leaderName:
          type: string
          minLength: 1
        leaderRole:
          type: string
        toneDescription:
          type: string
        missionStatement:
          type: string
        focusAreas:
          type: array
          items:
            type: string
      required:
        - churchName
        - leaderName

    PastorManuscript:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        fileName:
          type: string
        storedPath:
          type: string
        uploadedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - fileName
        - storedPath
        - uploadedAt

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    MeResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        onboardingCompletedAt:
          type: string
          format: date-time
          nullable: true
        profile:
          allOf:
            - $ref: "#/components/schemas/ChurchProfile"
          nullable: true
      required: [userId]

    ServicePlanContent:
      type: object
      description: Structured content for a service plan
      properties:
        callToWorship:
          type: string
          nullable: true
        openingPrayer:
          type: string
          nullable: true
        scriptureReading:
          type: string
          nullable: true
        sermonNotes:
          type: string
          nullable: true
        confession:
          type: string
          nullable: true
        assurance:
          type: string
          nullable: true
        benediction:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        order:
          type: array
          items:
            $ref: "#/components/schemas/ServicePlanItem"
      required: [order]

    ServicePlanItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [song, scripture, prayer, sermon, communion, offering, welcome, benediction, transition, custom]
        title:
          type: string
        body:
          type: string
        durationMinutes:
          type: integer
          nullable: true
        linkedKind:
          type: string
          nullable: true
          enum: [sermon, library_item]
          description: |
            Optional source this slot was pulled from. When present, the
            UI shows a "Linked to ..." pill that navigates to the source.
            `body` always carries a snapshot so the slot keeps rendering
            even if the source is later edited or deleted.
        linkedId:
          type: integer
          nullable: true
        linkedTitle:
          type: string
          nullable: true
          description: Snapshot of the linked source's title for display when the source is gone.
      required: [id, kind, title, body]

    LinkedServiceRef:
      type: object
      description: A service plan that links back to a sermon or library item.
      properties:
        id:
          type: integer
        title:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
      required: [id, title]

    ServicePlan:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
        content:
          $ref: "#/components/schemas/ServicePlanContent"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - scripture
        - theme
        - season
        - content
        - createdAt
        - updatedAt

    CreateServicePlanBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
        content:
          $ref: "#/components/schemas/ServicePlanContent"
      required: [title, content]

    UpdateServicePlanBody:
      type: object
      properties:
        title:
          type: string
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        serviceDate:
          type: string
          format: date-time
          nullable: true
        content:
          $ref: "#/components/schemas/ServicePlanContent"

    LibraryItem:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        kind:
          type: string
          enum: [liturgy, song, speaking_moment, devotional, soul_care]
        title:
          type: string
        content:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        isRepertoire:
          type: boolean
          description: True when this song is part of the user's personal repertoire that worship-song generators will prefer.
        createdAt:
          type: string
          format: date-time
      required: [id, userId, kind, title, content, tags, isRepertoire, createdAt]

    CreateLibraryItemBody:
      type: object
      properties:
        kind:
          type: string
          enum: [liturgy, song, speaking_moment, devotional, soul_care]
        title:
          type: string
          minLength: 1
        content:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        isRepertoire:
          type: boolean
          description: When true, also marks the saved song as part of the user's repertoire.
      required: [kind, title, content]

    UpdateLibraryItemBody:
      type: object
      description: Partial update for a saved library item. Any subset of title, content, or tags may be supplied.
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string

    SetRepertoireBody:
      type: object
      properties:
        isRepertoire:
          type: boolean
      required: [isRepertoire]

    BulkLibraryItemIdsBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1
      required: [ids]

    BulkSetRepertoireBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          minItems: 1
        isRepertoire:
          type: boolean
      required: [ids, isRepertoire]

    BulkLibraryActionResult:
      type: object
      properties:
        affected:
          type: integer
          description: Number of rows that were actually modified.
      required: [affected]

    RepertoireImportSong:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        artist:
          type: string
        style:
          type: string
        bpm:
          type: integer
          minimum: 30
          maximum: 300
          description: Optional tempo in beats per minute. Helps the AI pick fast songs for upbeat slots and slower songs for reflective ones.
        key:
          type: string
          description: Optional musical key (e.g. "G", "Db"). Pulled from CSV imports; stored on `content.key`.
        ccli:
          type: string
          description: Optional CCLI license number. Stored on `content.ccli` for traceability; not currently surfaced in the UI.
        notes:
          type: string
          description: Optional free-text notes from a CSV import. Stored on `content.notes`.
        arrangementNotes:
          type: string
          description: Optional free-text notes for the chosen arrangement (BPM/key/length). Stored on `content.arrangementNotes`.
        lastScheduledDate:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: "Optional ISO YYYY-MM-DD date the song was last scheduled. Stored verbatim on content.lastScheduledDate. Useful for ranking under-used songs later. The pattern enforces ISO format at the Zod layer; clients must normalize free-form dates (e.g. 'March 29, 2026') to ISO before submitting and OMIT malformed values rather than passing them through. We avoid format: date so the value stays a string end-to-end (no Date/string coercion in the contract)."
        tags:
          type: array
          items:
            type: string
      required: [title]

    BulkImportRepertoireBody:
      type: object
      properties:
        songs:
          type: array
          items:
            $ref: "#/components/schemas/RepertoireImportSong"
          minItems: 1
      required: [songs]

    BulkImportRepertoireResult:
      type: object
      properties:
        added:
          type: integer
          description: Number of new repertoire songs created.
        skippedDuplicates:
          type: integer
          description: Number of submitted titles that matched an existing repertoire song (case-insensitive title match).
        invalidLines:
          type: integer
          description: Number of submitted entries dropped because they lacked a usable title.
      required: [added, skippedDuplicates, invalidLines]

    DashboardStat:
      type: object
      properties:
        label:
          type: string
        value:
          type: integer
      required: [label, value]

    DashboardSuggestion:
      type: object
      properties:
        id:
          type: string
        prompt:
          type: string
        kind:
          type: string
          enum: [service, liturgy, songs, speaking_moment, devotional, soul_care]
      required: [id, prompt, kind]

    DashboardResponse:
      type: object
      properties:
        verseOfDay:
          type: object
          properties:
            text:
              type: string
            reference:
              type: string
          required: [text, reference]
        recentServices:
          type: array
          items:
            $ref: "#/components/schemas/ServicePlan"
        servicesThisMonth:
          type: integer
        librarySize:
          type: integer
        totalServices:
          type: integer
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/DashboardSuggestion"
        trial:
          $ref: "#/components/schemas/DashboardTrialSummary"
      required: [verseOfDay, recentServices, servicesThisMonth, librarySize, totalServices, suggestions, trial]

    DashboardTrialSummary:
      type: object
      required: [isActive, daysLeft, trialEndsAt, activated, servicePlans, sermons, libraryItems]
      properties:
        isActive:
          type: boolean
        daysLeft:
          type: integer
          nullable: true
        trialEndsAt:
          type: string
          format: date-time
          nullable: true
        activated:
          type: boolean
        servicePlans:
          type: integer
        sermons:
          type: integer
        libraryItems:
          type: integer

    GenerateServicePlanBody:
      type: object
      properties:
        theme:
          type: string
        scripture:
          type: string
        season:
          type: string
        serviceLength:
          type: string
          description: e.g. "60 minutes", "75 minutes"
        notes:
          type: string
        flow:
          type: array
          description: |
            Optional ordered service flow defined by the user. When present,
            the generator MUST return `content.order` with exactly these
            entries in this order, preserving each step's kind and the
            supplied `stepName` as the slot's title.
          items:
            $ref: "#/components/schemas/ServiceFlowStep"
      required: [theme]

    ServiceFlowStep:
      type: object
      description: One step in a user-defined service flow.
      properties:
        stepName:
          type: string
          minLength: 1
          description: The display name for this step (e.g. "Prayer of Confession").
        kind:
          type: string
          enum: [song, scripture, prayer, sermon, communion, offering, welcome, benediction, transition, custom]
      required: [stepName, kind]

    ServiceTemplate:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        description:
          type: string
        flow:
          type: array
          items:
            $ref: "#/components/schemas/ServiceFlowStep"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, name, description, flow, createdAt, updatedAt]

    CreateServiceTemplateBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        flow:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceFlowStep"
      required: [name, flow]

    UpdateServiceTemplateBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        flow:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceFlowStep"

    GeneratedServicePlan:
      type: object
      properties:
        title:
          type: string
        scripture:
          type: string
        theme:
          type: string
        season:
          type: string
        content:
          $ref: "#/components/schemas/ServicePlanContent"
      required: [title, scripture, theme, season, content]

    GenerateStepContentBody:
      type: object
      description: |
        Request body for regenerating the text of a single service-plan slot.
        `kind` must be a valid `ServiceFlowStep.kind` other than `sermon`.
      properties:
        kind:
          type: string
          enum: [song, scripture, prayer, communion, offering, welcome, benediction, transition, custom]
        stepName:
          type: string
          minLength: 1
          description: The slot's title as the user named it (e.g. "Opening Song").
        theme:
          type: string
        scripture:
          type: string
        season:
          type: string
        serviceLength:
          type: string
        notes:
          type: string
      required: [kind, stepName, theme]

    GeneratedStepContent:
      type: object
      properties:
        body:
          type: string
          description: The regenerated body text for the slot.
        durationMinutes:
          type: integer
          nullable: true
      required: [body]

    GenerateJobStarted:
      type: object
      description: |
        Returned by `POST /generate/step-content` to start a background
        generation job. Clients then poll `GET /generate/jobs/{jobId}` for
        status. (Other `/generate/*` endpoints in this spec are still
        documented as SSE/direct-result responses.)
      properties:
        jobId:
          type: string
      required: [jobId]

    GenerateJobSnapshot:
      type: object
      description: |
        Snapshot of a background generation job. `result` is present when
        `status` is `done`; its shape depends on which generation endpoint
        started the job.
      properties:
        status:
          type: string
          enum: [pending, done, error, unknown]
        charsReceived:
          type: integer
          description: Total characters of model output accumulated so far.
        partialTail:
          type: string
          description: Tail of the streamed model text, capped server-side.
        result:
          description: |
            Final result payload when `status` is `done`. Shape depends on
            the endpoint that started the job (e.g. `GeneratedStepContent`
            for `/generate/step-content`).
        errorMessage:
          type: string
          description: Human-readable error when `status` is `error`.
      required: [status]

    GenerateLiturgyBody:
      type: object
      properties:
        kind:
          type: string
          enum: [call_to_worship, opening_prayer, confession, assurance, communion, benediction, prayer_of_the_people, responsive_psalm, affirmation_of_faith, lament, baptism, commissioning, candle_lighting, doxology]
        theme:
          type: string
        scripture:
          type: string
        season:
          type: string
        tone:
          type: string
          description: e.g. "contemplative", "celebratory"
        format:
          type: string
          enum: [call_response, leader_only]
          description: |
            Output format style.
            - `call_response` (default): leader/people antiphonal lines.
            - `leader_only`: a single continuous spoken piece in the leader's voice.
        alignmentNotes:
          type: string
          maxLength: 4000
          description: Optional sermon notes, song lyrics, or other text the liturgy should echo in language and imagery.
      required: [kind, theme]

    RecommendedScripture:
      type: object
      properties:
        reference:
          type: string
          description: A specific passage reference, e.g. "Psalm 95:1-7".
        rationale:
          type: string
          description: One short sentence on why this passage fits.
      required: [reference, rationale]

    GeneratedLiturgy:
      type: object
      properties:
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        notes:
          type: string
        format:
          type: string
          enum: [call_response, leader_only]
          description: The format the liturgy was generated in (echoes the request).
        alignmentNotes:
          type: string
          description: Echoes the alignment notes the user supplied (if any), so the saved item retains its provenance.
        recommendedScripture:
          $ref: "#/components/schemas/RecommendedScripture"
          description: Present only when the user did not supply a scripture; the AI's suggested anchor passage with rationale.
      required: [kind, title, body]

    GenerateSongsBody:
      type: object
      properties:
        theme:
          type: string
        scripture:
          type: string
        style:
          type: string
          description: e.g. "hymn", "modern worship", "gospel", "acoustic"
        count:
          type: integer
        repertoireMode:
          type: string
          enum: [off, prefer, strict]
          description: |
            How to use the user's saved repertoire when suggesting songs.
            - `off`: ignore the repertoire entirely.
            - `prefer` (default): prioritize repertoire songs and fill the rest with new suggestions.
            - `strict`: only suggest songs from the user's repertoire; never invent new titles.
        alignmentNotes:
          type: string
          maxLength: 4000
          description: Optional sermon notes, source text, or other material the song picks should echo in theme and imagery.
        bpmMin:
          type: integer
          minimum: 30
          maximum: 300
          description: Optional lower bound for the suggested songs' tempo. Bounds out of order are auto-swapped.
        bpmMax:
          type: integer
          minimum: 30
          maximum: 300
          description: Optional upper bound for the suggested songs' tempo. Bounds out of order are auto-swapped.
        preferredKeys:
          type: array
          items:
            type: string
          description: Optional list of preferred musical keys (e.g. ["G", "A", "Bb"]). The AI will bias toward these keys when choosing songs; other keys are still allowed when no repertoire fit exists.
      required: [theme]

    SongSuggestion:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string
        style:
          type: string
        bpm:
          type: integer
          nullable: true
          description: "Tempo in beats per minute. Returned only when the value comes from a trusted source — the user's repertoire (which itself can be sourced from Planning Center or hand-typed). The AI Song Assistant no longer guesses BPMs; rows where the server has no trusted value report `bpm: null` so worship leaders can fill them in deliberately."
        key:
          type: string
          nullable: true
          description: "Musical key of the song (e.g. 'G', 'Bb', 'F#m'). Returned when known from the user's repertoire (Planning Center import) or suggested by the AI based on the song's well-known recording."
        keyFromLibrary:
          type: boolean
          description: "True when the key value was sourced from the user's saved repertoire (authoritative). False or absent when the key is an AI suggestion."
        themes:
          type: array
          items:
            type: string
        whyItFits:
          type: string
        inRepertoire:
          type: boolean
          description: Server-set flag — true when the suggested title matches one of the user's repertoire songs (case-insensitive title match).
      required: [title, artist, whyItFits]

    GeneratedSongs:
      type: object
      properties:
        theme:
          type: string
        songs:
          type: array
          items:
            $ref: "#/components/schemas/SongSuggestion"
        notice:
          type: string
          description: Optional explanatory note from the server, e.g. when Strict mode produced fewer songs than requested.
        alignmentNotes:
          type: string
          description: Echoes the alignment notes the user supplied (if any), so the saved item retains its provenance.
      required: [theme, songs]

    GenerateSpeakingMomentBody:
      type: object
      properties:
        kind:
          type: string
          enum: [welcome, transition, communion_invitation, offering, benediction, announcement, sermon_introduction, scripture_introduction, prayer_invitation, response_invitation, children_moment, guest_welcome, ministry_spotlight, liturgy_setup]
        topic:
          type: string
        scripture:
          type: string
        durationSeconds:
          type: integer
        tone:
          type: string
        alignmentNotes:
          type: string
          maxLength: 4000
          description: Optional sermon notes, source text, or other material the speaking moment should echo in language and imagery.
      required: [kind]

    GeneratedSpeakingMoment:
      type: object
      properties:
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        deliveryNotes:
          type: string
        alignmentNotes:
          type: string
          description: Echoes the alignment notes the user supplied (if any), so the saved item retains its provenance.
      required: [kind, title, body]

    GenerateDevotionalBody:
      type: object
      properties:
        theme:
          type: string
        scripture:
          type: string
        durationMinutes:
          type: integer
        audience:
          type: string
          description: e.g. "worship team", "tech volunteers"
        alignmentNotes:
          type: string
          maxLength: 4000
          description: Optional sermon notes, source text, or other material the devotional should echo in language and imagery.
      required: [theme]

    GeneratedDevotional:
      type: object
      properties:
        title:
          type: string
        scripture:
          type: string
        opening:
          type: string
        body:
          type: string
        discussionQuestions:
          type: array
          items:
            type: string
        closingPrayer:
          type: string
        alignmentNotes:
          type: string
          description: Echoes the alignment notes the user supplied (if any), so the saved item retains its provenance.
      required: [title, scripture, opening, body, discussionQuestions, closingPrayer]

    GenerateSoulCareBody:
      type: object
      properties:
        audience:
          type: string
          enum: [self, team]
          description: Who the session is for. "self" speaks in the second person to a leader doing personal soul care; "team" guides a leader walking a group through the practice.
        intent:
          type: string
          maxLength: 4000
          description: Free-text "what's on your heart" — the user's current state, longings, or concerns.
        season:
          type: string
          description: |
            Season or state — e.g. "burnout", "grief", "anticipation",
            "ordinary time", "post-Easter", "Advent waiting",
            "Lenten dryness", "celebration".
        practiceTemplate:
          type: string
          enum:
            - auto
            - examen
            - lectio_divina
            - centering_prayer
            - silence_solitude
            - gratitude
            - lament
            - sabbath
            - breath_prayer
          description: |
            Spiritual practice tradition to base the session on, or "auto"
            to let the AI choose what fits the season and intent.
        durationMinutes:
          type: integer
          minimum: 10
          maximum: 60
      required: [audience]

    SoulCareScripture:
      type: object
      properties:
        reference:
          type: string
        text:
          type: string
          description: The actual passage text (NIV or ESV).
        reflection:
          type: string
          description: 2-4 sentences inviting the participant into the passage.
      required: [reference, text, reflection]

    SoulCarePractice:
      type: object
      properties:
        name:
          type: string
          description: Short name for this guided practice, e.g. "Examen — Consolations".
        instructions:
          type: string
          description: Step-by-step guidance for leading or doing this practice.
        durationMinutes:
          type: integer
          minimum: 1
      required: [name, instructions]

    GeneratedSoulCare:
      type: object
      properties:
        title:
          type: string
        durationMinutes:
          type: integer
        practiceTradition:
          type: string
          description: The named spiritual practice this session draws from (e.g. "Lectio Divina").
        leaderNotes:
          type: string
          description: Pacing and posture notes for the person leading themselves or the team through this session.
        opening:
          type: string
          description: A centering moment or breath prayer to open the time.
        scripture:
          $ref: "#/components/schemas/SoulCareScripture"
        practices:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/SoulCarePractice"
        journalingPrompts:
          type: array
          items:
            type: string
        closing:
          type: string
          description: A closing prayer or blessing.
        takeHomePractice:
          type: string
          description: A simple practice to carry into the rest of the day or week.
        intent:
          type: string
          description: Echoes the "what's on your heart" intent the user supplied (if any), so the saved item retains its provenance.
      required: [title, durationMinutes, practiceTradition, opening, scripture, practices, journalingPrompts, closing, takeHomePractice]

    WordStudyEntry:
      type: object
      properties:
        term:
          type: string
          description: The English word as it appears in the translation (e.g. "grace", "love").
        originalWord:
          type: string
          description: The Greek or Hebrew word in Unicode script (e.g. "χάρις", "חֶסֶד").
        transliteration:
          type: string
          description: Phonetic transliteration (e.g. "charis", "chesed").
        language:
          type: string
          enum: [Greek, Hebrew]
        strongsNumber:
          type: string
          nullable: true
          description: Strong's Concordance number (e.g. "G5485"). Null if uncertain.
        definition:
          type: string
          description: 2–3 sentence definition covering the word's semantic range.
        significance:
          type: string
