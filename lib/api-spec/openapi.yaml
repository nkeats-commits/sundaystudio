        status:
          type: string
        tags:
          type: array
          items:
            type: string

    SermonResourceRef:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        excerpt:
          type: string
      required: [title, excerpt]

    SermonContextBlurb:
      type: object
      description: |
        Common shape every sermon-generator request shares so the AI gets the
        sermon's context, the church's context, and any selected resources.
      properties:
        title:
          type: string
        passage:
          type: string
        secondaryPassages:
          type: array
          items:
            type: string
        theme:
          type: string
        series:
          type: string
        seriesId:
          type: integer
          nullable: true
          description: Parent sermon series id. When provided, the server hydrates the parent series' big idea and summary into the prompt context.
        seriesBigIdea:
          type: string
          description: Big idea of the parent sermon series, if any. Server hydrates this from `seriesId` — clients should leave this blank.
        seriesSummary:
          type: string
          description: Short summary of the parent sermon series, if any. Server hydrates this from `seriesId` — clients should leave this blank.
        occasion:
          type: string
        audience:
          type: string
        length:
          type: string
        tone:
          type: string
        style:
          type: string
        depth:
          type: string
        outputFormat:
          type: string
        pastorNotes:
          type: string
        resources:
          type: array
          items:
            $ref: "#/components/schemas/SermonResourceRef"
      required: [passage]

    GenerateSermonStudyBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            refineInstruction:
              type: string
            existingContent:
              $ref: "#/components/schemas/SermonStudyOutput"

    GenerateSermonBigIdeaBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            study:
              $ref: "#/components/schemas/SermonStudyOutput"
            refineInstruction:
              type: string

    GenerateSermonOutlineBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            study:
              $ref: "#/components/schemas/SermonStudyOutput"
            bigIdea:
              type: string
            refineInstruction:
              type: string
            existingContent:
              $ref: "#/components/schemas/SermonOutlineOutput"

    GenerateSermonManuscriptBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            study:
              $ref: "#/components/schemas/SermonStudyOutput"
            bigIdea:
              type: string
            outline:
              $ref: "#/components/schemas/SermonOutlineOption"
            refineInstruction:
              type: string
            existingContent:
              $ref: "#/components/schemas/SermonManuscriptOutput"

    GenerateSermonApplicationsBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            study:
              $ref: "#/components/schemas/SermonStudyOutput"
            bigIdea:
              type: string
            refineInstruction:
              type: string

    GenerateSermonIllustrationsBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            bigIdea:
              type: string
            outline:
              $ref: "#/components/schemas/SermonOutlineOption"
            refineInstruction:
              type: string

    GenerateSermonToServiceBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            bigIdea:
              type: string
            outline:
              $ref: "#/components/schemas/SermonOutlineOption"
            applications:
              $ref: "#/components/schemas/SermonApplicationsOutput"
            refineInstruction:
              type: string

    GenerateSermonSmallGroupQuestionsBody:
      allOf:
        - $ref: "#/components/schemas/SermonContextBlurb"
        - type: object
          properties:
            bigIdea:
              type: string
