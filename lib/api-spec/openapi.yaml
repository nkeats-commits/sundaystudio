openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sunday Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Church profile operations
  - name: services
    description: Service plan operations
  - name: library
    description: Saved library items
  - name: dashboard
    description: Dashboard summaries
  - name: generate
    description: AI generation endpoints
  - name: sermons
    description: Sermon Builder operations
  - name: sermon-resources
    description: Sermon resource library (commentary excerpts, scholar notes, etc.)
  - name: sermon-exports
    description: Exported sermon documents
  - name: sermon-series
    description: Multi-week sermon series (shared big idea + ordered sermons)
  - name: service-templates
    description: Saved reusable service flows (the ordered skeleton of a service)
  - name: integrations
    description: Third-party integrations (Planning Center Services, etc.)
  - name: billing
    description: Subscription billing (trial + Stripe)
  - name: admin
    description: Owner-only admin panel (single-admin model gated by OWNER_EMAIL)
  - name: help
    description: Public help center articles
  - name: onboarding
    description: First-run onboarding wizard state
  - name: manuscripts
    description: Pastor sermon manuscript management and voice analysis
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getMe
      tags: [profile]
      summary: Get current user and church profile
      responses:
        "200":
          description: Current user with profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Mark onboarding as complete for the current user
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingCompletedAt:
                    type: string
                    format: date-time
                required: [onboardingCompletedAt]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/church:
    put:
      operationId: updateChurchProfile
      tags: [profile]
      summary: Create or update the church profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertChurchProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Dashboard summary with recent services, stats, and suggestions
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /trial-events:
    post:
      operationId: recordTrialEvent
      tags: [billing]
      summary: Record a trial conversion funnel event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialEventBody"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialEventAccepted"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /service-plans:
    get:
      operationId: listServicePlans
      tags: [services]
      summary: List all service plans for the current user
      responses:
        "200":
          description: List of service plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServicePlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createServicePlan
      tags: [services]
      summary: Create a new service plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServicePlanBody"
      responses:
        "201":
          description: Created service plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /service-plans/{id}:
    get:
      operationId: getServicePlan
      tags: [services]
      summary: Get a service plan by id
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Service plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateServicePlan
      tags: [services]
      summary: Update a service plan
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServicePlanBody"
      responses:
        "200":
          description: Updated service plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteServicePlan
      tags: [services]
      summary: Delete a service plan
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /service-plans/{id}/export:
    post:
      operationId: exportServicePlan
      tags: [services]
      summary: Render a service plan to text or markdown
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportServicePlanBody"
      responses:
        "200":
          description: Exported service plan document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePlanExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /library:
    get:
      operationId: listLibraryItems
      tags: [library]
      summary: List saved library items
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [liturgy, song, speaking_moment, devotional, soul_care]
        - name: repertoire
          in: query
          required: false
          description: When true, only return items the user has marked as part of their repertoire.
          schema:
            type: boolean
      responses:
        "200":
          description: List of library items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createLibraryItem
      tags: [library]
      summary: Save an item to the library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryItemBody"
      responses:
        "201":
          description: Created library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /library/{id}:
    patch:
      operationId: updateLibraryItem
      tags: [library]
      summary: Update a saved library item (title, content, and/or tags).
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryItemBody"
      responses:
        "200":
          description: Updated library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteLibraryItem
      tags: [library]
      summary: Delete a library item
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  /library/{id}/repertoire:
    patch:
      operationId: setLibraryItemRepertoire
      tags: [library]
      summary: Toggle whether a library item is part of the user's repertoire.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRepertoireBody"
      responses:
        "200":
          description: Updated library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /library/bulk:
    delete:
      operationId: bulkDeleteLibraryItems
      tags: [library]
      summary: Permanently delete multiple library items by ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkLibraryItemIdsBody"
      responses:
        "200":
          description: Deletion summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLibraryActionResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /library/bulk-repertoire:
    patch:
      operationId: bulkSetLibraryItemRepertoire
      tags: [library]
      summary: Bulk-update the isRepertoire flag on multiple library items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkSetRepertoireBody"
      responses:
        "200":
          description: Update summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkLibraryActionResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /library/repertoire/bulk-import:
    post:
      operationId: bulkImportRepertoire
      tags: [library]
      summary: Bulk-add songs to the user's repertoire from a parsed list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportRepertoireBody"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportRepertoireResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /library/{id}/linked-services:
    get:
      operationId: listServicesLinkedToLibraryItem
      tags: [library]
      summary: List service plans whose order references this library item.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Service plans linked to this library item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedServiceRef"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /service-templates:
    get:
      operationId: listServiceTemplates
      tags: [service-templates]
      summary: List the user's saved service flow templates
      responses:
        "200":
          description: List of service templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceTemplate"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createServiceTemplate
      tags: [service-templates]
      summary: Save a new service flow template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceTemplateBody"
      responses:
        "201":
          description: Created service template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTemplate"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A template with this name already exists for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /service-templates/{id}:
    patch:
      operationId: updateServiceTemplate
      tags: [service-templates]
      summary: Rename or update a saved service flow template
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceTemplateBody"
      responses:
        "200":
          description: Updated service template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceTemplate"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A template with this name already exists for this user
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      operationId: deleteServiceTemplate
      tags: [service-templates]
      summary: Delete a saved service flow template
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /generate/service-plan:
    post:
      operationId: generateServicePlan
      tags: [generate]
      summary: AI-generate a full service plan outline (streamed over SSE)
      description: |
        Streams the model output back as Server-Sent Events to avoid the
        autoscale proxy's 30s idle timeout. The Zod request schema is
        validated first; on success the response switches to SSE.

        Wire protocol (`text/event-stream`):
          - `event: delta`  data: `{ "text": "..." }` per token chunk
          - `event: done`   data: the final parsed `GeneratedServicePlan`
          - `event: error`  data: `{ "message": "..." }`
          - `: ping`        keepalive comments every ~10s

        On validation failure the response is a normal `application/json`
        body with status `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateServicePlanBody"
      responses:
        "200":
          description: |
            SSE stream. Final `done` event payload conforms to
            `GeneratedServicePlan`.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE-framed text stream; see operation description.
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedServicePlan"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/liturgy:
    post:
      operationId: generateLiturgy
      tags: [generate]
      summary: AI-generate a liturgy (call to worship, prayer, benediction, etc.) — streamed over SSE
      description: |
        Streams the model output as SSE. See `/generate/service-plan` for
        the wire protocol. The final `done` event payload conforms to
        `GeneratedLiturgy`. Validation failures return `400 application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLiturgyBody"
      responses:
        "200":
          description: SSE stream; final `done` event is a `GeneratedLiturgy`.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedLiturgy"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/songs:
    post:
      operationId: generateSongSuggestions
      tags: [generate]
      summary: AI-suggest worship songs for a theme or scripture — streamed over SSE
      description: |
        Streams the model output as SSE. See `/generate/service-plan` for
        the wire protocol. The final `done` event payload conforms to
        `GeneratedSongs`. Validation failures return `400 application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSongsBody"
      responses:
        "200":
          description: SSE stream; final `done` event is a `GeneratedSongs`.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedSongs"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/speaking-moment:
    post:
      operationId: generateSpeakingMoment
      tags: [generate]
      summary: AI-generate a speaking moment — streamed over SSE
      description: |
        Streams the model output as SSE. See `/generate/service-plan` for
        the wire protocol. The final `done` event payload conforms to
        `GeneratedSpeakingMoment`. Validation failures return `400 application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSpeakingMomentBody"
      responses:
        "200":
          description: SSE stream; final `done` event is a `GeneratedSpeakingMoment`.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedSpeakingMoment"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/step-content:
    post:
      operationId: generateStepContent
      tags: [generate]
      summary: Start an async job to regenerate body text for a single service-plan slot
      description: |
        Starts a background generation job for a single step inside a
        service plan. The endpoint returns `{ jobId }` immediately; clients
        must poll `GET /generate/jobs/{jobId}` until the job's `status` is
        `done` (the snapshot's `result` then conforms to
        `GeneratedStepContent`) or `error`. The slot's `kind` MUST NOT be
        `sermon` — sermon content is authored in Sermon Builder and is not
        eligible for inline regeneration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateStepContentBody"
      responses:
        "200":
          description: Job started. Poll `/generate/jobs/{jobId}` for the result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateJobStarted"
        "400":
          description: Invalid request body or unsupported kind.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/jobs/{jobId}:
    get:
      operationId: getGenerationJob
      tags: [generate]
      summary: Poll the status of a background generation job
      description: |
        Returns a snapshot of the job. When `status` is `done`, `result`
        holds the final payload (its shape depends on which generation
        endpoint started the job — e.g. `GeneratedStepContent` for
        `/generate/step-content`). When `status` is `unknown`, the polled
        worker doesn't own this job (autoscale routing); clients should
        keep polling until they hit the right worker or give up.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateJobSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: cancelGenerationJob
      tags: [generate]
      summary: Cancel a background generation job
      description: |
        Idempotent. Always returns `204` so callers don't have to
        special-case "job already gone" or autoscale cross-worker misses.
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cancellation requested (idempotent).
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/devotional:
    post:
      operationId: generateDevotional
      tags: [generate]
      summary: AI-generate a team devotional for rehearsal — streamed over SSE
      description: |
        Streams the model output as SSE. See `/generate/service-plan` for
        the wire protocol. The final `done` event payload conforms to
        `GeneratedDevotional`. Validation failures return `400 application/json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDevotionalBody"
      responses:
        "200":
          description: SSE stream; final `done` event is a `GeneratedDevotional`.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDevotional"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /generate/soul-care:
    post:
      operationId: generateSoulCare
      tags: [generate]
      summary: AI-generate a guided soul-care session for a leader or team
      description: |
        Starts a background job that generates a complete soul-care session
        (centering, scripture+reflection, 2-4 guided practices, journaling
        prompts, closing, take-home practice). Returns `{ jobId }` immediately;
        poll `/generate/jobs/{jobId}` for the result, which conforms to
        `GeneratedSoulCare`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSoulCareBody"
      responses:
        "200":
          description: Job started; poll for the result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId:
                    type: string
                required: [jobId]
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sermon-series:
    get:
      operationId: listSermonSeries
      tags: [sermon-series]
      summary: List sermon series for the current user
      responses:
        "200":
          description: List of sermon series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SermonSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSermonSeries
      tags: [sermon-series]
      summary: Create a sermon series
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSermonSeriesBody"
      responses:
        "201":
          description: Created sermon series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SermonSeries"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sermon-series/{id}:
    get:
      operationId: getSermonSeries
      tags: [sermon-series]
      summary: Get a sermon series with its ordered sermons
      parameters:
